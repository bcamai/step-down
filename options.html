<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Ustawienia Mindful Browser</title>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 500px; }
        h1 { font-size: 26px; margin-top: 0; color: #2c3e50; font-weight: 600; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; margin-bottom: 25px; }
        label { display: block; margin-top: 20px; font-weight: 600; font-size: 15px; color: #444; }
        input[type="number"], textarea { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 15px; transition: border-color 0.3s; }
        input[type="number"]:focus, textarea:focus { border-color: #3498db; outline: none; }
        textarea { resize: vertical; height: 120px; line-height: 1.5; }
        button { margin-top: 30px; padding: 14px 20px; background-color: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; width: 100%; transition: all 0.3s; }
        button:hover { background-color: #2980b9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(52,152,219,0.3); }
        #status { margin-top: 15px; text-align: center; color: #27ae60; font-weight: 500; min-height: 20px; font-size: 14px; }
        .help { font-size: 13px; color: #7f8c8d; margin-top: 5px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ustawienia</h1>
        
        <label for="waitTime">Czas czekania (sekundy)</label>
        <div class="help">Ile sekund musisz odczekać przed wejściem na blokowaną stronę.</div>
        <input type="number" id="waitTime" min="1" max="300" value="10">
        
        <label for="blockedSites">Blokowane strony</label>
        <div class="help">Wpisz domeny oddzielone przecinkami (np. facebook.com, instagram.com, reddit.com).</div>
        <textarea id="blockedSites"></textarea>
        
        <button id="saveBtn">Zapisz ustawienia</button>
        <div id="status"></div>
    </div>
    <script src="options.js"></script>
</body>
</html>
