<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zatrzymaj się</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #2c3e50; color: white; }
        .circle { width: 150px; height: 150px; border-radius: 50%; background-color: #3498db; animation: breathe 8s infinite ease-in-out; }
        @keyframes breathe {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
        button { margin-top: 30px; padding: 10px 20px; font-size: 16px; display: none; }
    </style>
</head>
<body>
    <h1>Zatrzymaj się i weź głęboki oddech...</h1>
    <div class="circle"></div>
    <p id="timer">Poczekaj 5 sekund...</p>
    <button id="continueBtn">Chcę wejść na stronę</button>

    <script src="breathe.js"></script>
</body>
</html>
