<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Statystyki Mindful Browser</title>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; width: 320px; padding: 15px; margin: 0; background: #fdfdfd; color: #333; }
        h2 { font-size: 16px; margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 15px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 14px; align-items: center; }
        li:last-child { border-bottom: none; }
        .domain { font-weight: 600; color: #3498db; }
        .time { color: #555; background: #ecf0f1; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .no-data { font-size: 13px; color: #7f8c8d; text-align: center; margin: 20px 0; }
        .btn { display: block; width: 100%; box-sizing: border-box; text-align: center; background: #ecf0f1; border: none; border-radius: 6px; padding: 10px; margin-top: 15px; cursor: pointer; text-decoration: none; color: #2c3e50; font-size: 13px; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #dfe6e9; }
    </style>
</head>
<body>
    <h2>Dzisiejsze statystyki</h2>
    <ul id="statsList"></ul>
    <div id="noData" class="no-data" style="display: none;">Brak danych na dzisiaj.</div>
    <button id="openOptions" class="btn">Otwórz ustawienia</button>
    <script src="popup.js"></script>
</body>
</html>
